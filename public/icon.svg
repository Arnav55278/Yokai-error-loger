<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="60%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Dark Border -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3"/>

  <!-- Glowing Apex Vault Shield & Triangle -->
  <g filter="url(#neonGlow)" transform="translate(0, 8)">
    <!-- Outer Hex-Shield / Delta -->
    <path d="M 256 90 L 390 190 L 340 370 L 256 420 L 172 370 L 122 190 Z" 
          fill="none" stroke="url(#neonCyan)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner Golden Ratio Core Triangle -->
    <polygon points="256,150 350,330 162,330" 
             fill="none" stroke="url(#neonPurple)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Center Active Quantum Spark / Dot -->
    <circle cx="256" cy="270" r="24" fill="#38bdf8"/>
    <circle cx="256" cy="270" r="10" fill="#ffffff"/>
  </g>

  <!-- Typography Wordmark at Base -->
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
        font-weight="900" font-size="34" letter-spacing="4" fill="#f8fafc">
    APEXVAULT
  </text>
</svg>
